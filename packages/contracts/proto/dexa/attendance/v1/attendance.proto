syntax = "proto3";

package dexa.attendance.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AttendanceService {
  rpc GetAttendanceZone(google.protobuf.Empty) returns (AttendanceZone);
  rpc UpdateAttendanceZone(UpdateAttendanceZoneRequest) returns (AttendanceZone);
  rpc AuthorizeEvidenceUpload(AuthorizeEvidenceUploadRequest) returns (EvidenceUploadAuthorization);
  rpc AuthorizeEvidenceAccess(AuthorizeEvidenceAccessRequest) returns (EvidenceAccessAuthorization);
  rpc CreateRegularAttendance(CreateRegularAttendanceRequest) returns (AttendanceEntry);
  rpc CreateManualAttendance(CreateManualAttendanceRequest) returns (AttendanceEntry);
  rpc ListPendingManualAttendance(ListPendingManualAttendanceRequest) returns (ListPendingManualAttendanceResponse);
  rpc GetManualAttendance(GetManualAttendanceRequest) returns (AttendanceEntry);
  rpc DecideManualAttendance(DecideManualAttendanceRequest) returns (AttendanceEntry);
}

message AuthorizeEvidenceUploadRequest {
  string content_type = 1;
  int32 size_bytes = 2;
}

message EvidenceUploadAuthorization {
  string upload_id = 1;
  string method = 2;
  string url = 3;
  map<string, string> headers = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message AuthorizeEvidenceAccessRequest {
  string evidence_id = 1;
}

message EvidenceAccessAuthorization {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

enum ClockType {
  CLOCK_TYPE_UNSPECIFIED = 0;
  CLOCK_TYPE_CLOCK_IN = 1;
  CLOCK_TYPE_CLOCK_OUT = 2;
}

enum AttendanceSource {
  ATTENDANCE_SOURCE_UNSPECIFIED = 0;
  ATTENDANCE_SOURCE_REGULAR = 1;
  ATTENDANCE_SOURCE_MANUAL = 2;
}

enum AttendanceStatus {
  ATTENDANCE_STATUS_UNSPECIFIED = 0;
  ATTENDANCE_STATUS_PENDING_REVIEW = 1;
  ATTENDANCE_STATUS_RECORDED = 2;
  ATTENDANCE_STATUS_REJECTED = 3;
}

message CreateRegularAttendanceRequest {
  ClockType clock_type = 1;
  double latitude = 2;
  double longitude = 3;
  double accuracy_meters = 4;
  string evidence_upload_id = 5;
}

message CreateManualAttendanceRequest {
  ClockType clock_type = 1;
  string work_date = 2;
  google.protobuf.Timestamp claimed_at = 3;
  string address = 4;
  double latitude = 5;
  double longitude = 6;
  string reason = 7;
  string evidence_upload_id = 8;
}

message AttendanceLocation {
  optional string address = 1;
  double latitude = 2;
  double longitude = 3;
  optional double accuracy_meters = 4;
  optional double distance_meters = 5;
}

message AttendanceDecision {
  string decided_by_employee_id = 1;
  google.protobuf.Timestamp decided_at = 2;
  string reason = 3;
}

message AttendanceEntry {
  string id = 1;
  string employee_id = 2;
  string work_date = 3;
  ClockType clock_type = 4;
  AttendanceSource source = 5;
  AttendanceStatus status = 6;
  optional google.protobuf.Timestamp occurred_at = 7;
  optional google.protobuf.Timestamp claimed_at = 8;
  google.protobuf.Timestamp submitted_at = 9;
  AttendanceLocation location = 10;
  optional string reason = 11;
  optional string evidence_id = 12;
  optional AttendanceDecision decision = 13;
  bool idempotent_replay = 14;
}

message ListPendingManualAttendanceRequest {
  optional string cursor = 1;
  int32 limit = 2;
}

message ListPendingManualAttendanceResponse {
  repeated AttendanceEntry items = 1;
  optional string next_cursor = 2;
  bool has_next_page = 3;
}

message GetManualAttendanceRequest {
  string entry_id = 1;
}

enum ManualAttendanceDecision {
  MANUAL_ATTENDANCE_DECISION_UNSPECIFIED = 0;
  MANUAL_ATTENDANCE_DECISION_APPROVE = 1;
  MANUAL_ATTENDANCE_DECISION_REJECT = 2;
}

message DecideManualAttendanceRequest {
  string entry_id = 1;
  ManualAttendanceDecision decision = 2;
  optional string reason = 3;
}

message AttendanceZone {
  string name = 1;
  string address = 2;
  double latitude = 3;
  double longitude = 4;
  double radius_meters = 5;
  bool active = 6;
}

message UpdateAttendanceZoneRequest {
  string name = 1;
  string address = 2;
  double latitude = 3;
  double longitude = 4;
  double radius_meters = 5;
  bool active = 6;
}
