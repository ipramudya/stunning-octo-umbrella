syntax = "proto3";

package dexa.identity.v1;

import "google/protobuf/empty.proto";

service IdentityService {
  rpc Login(LoginRequest) returns (SessionCredentials);
  rpc RefreshSession(RefreshSessionRequest) returns (SessionCredentials);
  rpc LogoutSession(LogoutSessionRequest) returns (google.protobuf.Empty);
  rpc AuthorizeAccess(AuthorizeAccessRequest) returns (Authorization);
  rpc ListEmployees(ListEmployeesRequest) returns (ListEmployeesResponse);
  rpc CreateEmployee(CreateEmployeeRequest) returns (EmployeeProfile);
  rpc GetEmployee(GetEmployeeRequest) returns (EmployeeProfile);
  rpc BatchGetEmployees(BatchGetEmployeesRequest) returns (BatchGetEmployeesResponse);
  rpc UpdateEmployeeProfile(UpdateEmployeeProfileRequest) returns (EmployeeProfile);
  rpc UpdateEmployeePhoneNumber(UpdateEmployeePhoneNumberRequest) returns (EmployeeProfile);
  rpc ResetEmployeePassword(ResetEmployeePasswordRequest) returns (google.protobuf.Empty);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_EMPLOYEE = 1;
  ROLE_HRD = 2;
}

enum TokenAudience {
  TOKEN_AUDIENCE_UNSPECIFIED = 0;
  TOKEN_AUDIENCE_IDENTITY = 1;
  TOKEN_AUDIENCE_ATTENDANCE = 2;
}

message LoginRequest {
  string phone_number = 1;
  string password = 2;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message LogoutSessionRequest {
  string refresh_token = 1;
}

message AuthorizeAccessRequest {
  repeated TokenAudience audiences = 1;
}

message EmployeeProfile {
  string id = 1;
  string employee_number = 2;
  string full_name = 3;
  string phone_number = 4;
  optional string email = 5;
  repeated Role roles = 6;
}

message ListEmployeesRequest {
  optional string query = 1;
  optional string cursor = 2;
  int32 limit = 3;
}

message ListEmployeesResponse {
  repeated EmployeeProfile items = 1;
  optional string next_cursor = 2;
  bool has_next_page = 3;
}

message CreateEmployeeRequest {
  string employee_number = 1;
  string full_name = 2;
  string phone_number = 3;
  optional string email = 4;
  string password = 5;
}

message GetEmployeeRequest {
  string employee_id = 1;
}

message BatchGetEmployeesRequest {
  repeated string employee_ids = 1;
}

message BatchGetEmployeesResponse {
  repeated EmployeeProfile items = 1;
}

message UpdateEmployeeProfileRequest {
  string employee_id = 1;
  optional string full_name = 2;
  optional string email = 3;
  bool clear_email = 4;
}

message UpdateEmployeePhoneNumberRequest {
  string employee_id = 1;
  string phone_number = 2;
}

message ResetEmployeePasswordRequest {
  string employee_id = 1;
  string password = 2;
}

message SessionCredentials {
  EmployeeProfile profile = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message AudienceToken {
  TokenAudience audience = 1;
  string token = 2;
}

message Authorization {
  EmployeeProfile profile = 1;
  string session_id = 2;
  repeated AudienceToken tokens = 3;
}
