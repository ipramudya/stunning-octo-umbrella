name: dexa

x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

x-attendance-environment: &attendance-environment
  JWT_ISSUER: ${JWT_ISSUER:-dexa-identity}
  ORACLE_CONNECT_STRING: oracle:1521/FREEPDB1
  ORACLE_PASSWORD: ${ATTENDANCE_ORACLE_PASSWORD:-DexaAttendance1!}
  ORACLE_USER: DEXA_ATTENDANCE
  PKI_DIR: /app/.local/pki
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dexaadmin}
  MINIO_EVIDENCE_BUCKET: attendance-evidence
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-DexaMinio1!}

x-identity-environment: &identity-environment
  ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-19456}
  ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
  ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
  JWT_ISSUER: ${JWT_ISSUER:-dexa-identity}
  ORACLE_CONNECT_STRING: oracle:1521/FREEPDB1
  ORACLE_PASSWORD: ${IDENTITY_ORACLE_PASSWORD:-DexaIdentity1!}
  ORACLE_USER: DEXA_IDENTITY
  PKI_DIR: /app/.local/pki
  REDIS_PASSWORD: ${REDIS_PASSWORD:-DexaRedis1!}
  REDIS_URL: redis://redis:6379

services:
  pki-init:
    image: alpine/openssl:3.5.4
    entrypoint: ['/bin/sh', '/init.sh']
    restart: 'no'
    volumes:
      - ./infra/pki/init.sh:/init.sh:ro
      - attendance-pki:/pki/attendance
      - gateway-pki:/pki/gateway
      - identity-pki:/pki/identity

  oracle:
    image: gvenzl/oracle-free:23.26.0-faststart
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-DexaOracle1!}
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - oracle-data:/opt/oracle/oradata

  identity-schema:
    image: gvenzl/oracle-free:23.26.0-faststart
    restart: 'no'
    depends_on:
      oracle:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-c']
    command:
      - >-
        [[ "$$IDENTITY_ORACLE_PASSWORD" =~ ^[A-Za-z0-9_#!_-]+$$ ]] ||
        { echo 'IDENTITY_ORACLE_PASSWORD contains unsupported characters' >&2; exit 1; };
        sqlplus -s system/"$$ORACLE_PASSWORD"@//oracle:1521/FREEPDB1
        @/schema.sql "$$IDENTITY_ORACLE_PASSWORD"
    environment:
      IDENTITY_ORACLE_PASSWORD: ${IDENTITY_ORACLE_PASSWORD:-DexaIdentity1!}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-DexaOracle1!}
    volumes:
      - ./infra/oracle/create-identity-schema.sql:/schema.sql:ro

  attendance-schema:
    image: gvenzl/oracle-free:23.26.0-faststart
    restart: 'no'
    depends_on:
      oracle:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-c']
    command:
      - >-
        [[ "$$ATTENDANCE_ORACLE_PASSWORD" =~ ^[A-Za-z0-9_#!_-]+$$ ]] ||
        { echo 'ATTENDANCE_ORACLE_PASSWORD contains unsupported characters' >&2; exit 1; };
        sqlplus -s system/"$$ORACLE_PASSWORD"@//oracle:1521/FREEPDB1
        @/schema.sql "$$ATTENDANCE_ORACLE_PASSWORD"
    environment:
      ATTENDANCE_ORACLE_PASSWORD: ${ATTENDANCE_ORACLE_PASSWORD:-DexaAttendance1!}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-DexaOracle1!}
    volumes:
      - ./infra/oracle/create-attendance-schema.sql:/schema.sql:ro

  attendance-migrate:
    image: dexa-attendance:local
    restart: 'no'
    command:
      ['node', 'scripts/oracle-migrate.mjs', 'apps/attendance/migrations']
    depends_on:
      attendance-schema:
        condition: service_completed_successfully
    environment: *attendance-environment

  attendance-seed:
    image: dexa-attendance:local
    restart: 'no'
    command: ['node', 'apps/attendance/dist/scripts/seed.js']
    depends_on:
      attendance-migrate:
        condition: service_completed_successfully
    environment: *attendance-environment

  identity-migrate:
    image: dexa-identity:local
    restart: 'no'
    command: ['node', 'scripts/oracle-migrate.mjs', 'apps/identity/migrations']
    depends_on:
      identity-schema:
        condition: service_completed_successfully
    environment: *identity-environment

  identity-seed:
    image: dexa-identity:local
    restart: 'no'
    command: ['node', 'apps/identity/dist/scripts/seed.js']
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    environment:
      <<: *identity-environment
      DEMO_EMPLOYEE_PASSWORD: ${DEMO_EMPLOYEE_PASSWORD:-DexaEmployee1!}
      DEMO_HRD_PASSWORD: ${DEMO_HRD_PASSWORD:-DexaAdministrator1!}

  redis:
    image: redis:8.4.0-alpine
    command:
      - /bin/sh
      - -c
      - >-
        printf 'user default off\nuser identity on >%s ~identity:* +@connection +@scripting +@read +@write +time\nuser gateway on >%s ~rate:* +@connection +@scripting +@read +@write +time\n'
        "$${REDIS_PASSWORD}" "$${RATE_LIMIT_REDIS_PASSWORD}" > /tmp/users.acl &&
        exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
        --aclfile /tmp/users.acl
    environment:
      RATE_LIMIT_REDIS_PASSWORD: ${RATE_LIMIT_REDIS_PASSWORD:-DexaRateLimit1!}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-DexaRedis1!}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "redis-cli --user identity -a '${REDIS_PASSWORD:-DexaRedis1!}' --no-auth-warning ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    restart: unless-stopped
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-DexaMinio1!}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dexaadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/attendance-evidence &&
        mc version enable local/attendance-evidence &&
        mc ilm rule add --expire-days 1 --noncurrent-expire-days 1 --prefix staging/ local/attendance-evidence
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-DexaMinio1!}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dexaadmin}

  identity:
    <<: *app
    image: dexa-identity:local
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    depends_on:
      identity-seed:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *identity-environment
      GRPC_PORT: 50051
      HOST: 0.0.0.0
      HTTP_PORT: 3001
    volumes:
      - identity-pki:/app/.local/pki:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  attendance:
    <<: *app
    image: dexa-attendance:local
    build:
      context: .
      dockerfile: apps/attendance/Dockerfile
    depends_on:
      attendance-seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
    environment:
      <<: *attendance-environment
      GRPC_PORT: 50052
      HOST: 0.0.0.0
      HTTP_PORT: 3002
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
    volumes:
      - attendance-pki:/app/.local/pki:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    <<: *app
    image: dexa-gateway:local
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    depends_on:
      attendance:
        condition: service_healthy
      identity:
        condition: service_healthy
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      ATTENDANCE_GRPC_URL: attendance:50052
      HOST: 0.0.0.0
      HTTP_PORT: 3000
      IDENTITY_GRPC_URL: identity:50051
      PKI_DIR: /app/.local/pki
      RATE_LIMIT_REDIS_PASSWORD: ${RATE_LIMIT_REDIS_PASSWORD:-DexaRateLimit1!}
      RATE_LIMIT_REDIS_URL: redis://redis:6379
    volumes:
      - gateway-pki:/app/.local/pki:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '${GATEWAY_PORT:-3000}:3000'

volumes:
  attendance-pki:
  gateway-pki:
  identity-pki:
  minio-data:
  oracle-data:
  redis-data:
